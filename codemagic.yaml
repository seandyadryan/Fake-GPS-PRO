workflows:
  android-build:
    name: Android Build AAB & APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      fvm: true
      groups:
        - keystore_credentials
    scripts:
      - name: Install dependencies
        script: flutter pub get --fatal-warnings

      - name: Set up keystore for signing
        script: |
          if [ -z "$CM_KEYSTORE_BASE64" ]; then
            echo "ERROR: CM_KEYSTORE_BASE64 environment variable not set"
            echo "Set it in: CodeMagic UI -> Environment variables (base64 dari D:\KEYSTORE\fakegpspro.jks)"
            exit 1
          fi
          mkdir -p "$HOME/keystore"
          echo "$CM_KEYSTORE_BASE64" | base64 -d > "$HOME/keystore/fakegpspro.jks"
          cat > android/key.properties <<EOF
          storeFile=$HOME/keystore/fakegpspro.jks
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
          echo "Keystore decoded and key.properties written"

      - name: Build AAB (App Bundle)
        script: |
          flutter build appbundle --release

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk